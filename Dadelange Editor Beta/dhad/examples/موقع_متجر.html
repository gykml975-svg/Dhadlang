<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متجر ضاد</title></head><body><style>:root{font-family:var(--dhad-font,system-ui,sans-serif);color-scheme:light}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:var(--dhad-font,system-ui,sans-serif);color:var(--dhad-text,#17202a);background:var(--dhad-surface,#fff);line-height:1.75}.dhad-container{width:min(100% - 2rem,1200px);margin-inline:auto}.dhad-grid{display:grid;grid-template-columns:repeat(var(--dhad-columns,1),minmax(0,1fr));gap:var(--dhad-gap,1rem)}.dhad-flex{display:flex;flex-direction:var(--dhad-direction,row);gap:var(--dhad-gap,1rem);flex-wrap:wrap}.dhad-stack{display:flex;flex-direction:column;gap:var(--dhad-gap,1rem)}.dhad-row{display:flex;align-items:var(--dhad-align,center);gap:var(--dhad-gap,1rem);flex-wrap:wrap}.dhad-center{display:grid;place-items:center}.dhad-btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:var(--dhad-radius,12px);padding:.7rem 1rem;cursor:pointer;font:inherit}.dhad-btn-primary{background:var(--dhad-primary,#2563eb);color:#fff}.dhad-btn-secondary{background:transparent;color:var(--dhad-primary,#2563eb);border:1px solid currentColor}.dhad-link{color:var(--dhad-primary,#2563eb);text-decoration:none}.dhad-card{padding:1.25rem;border:1px solid color-mix(in srgb,var(--dhad-text,#17202a) 14%,transparent);border-radius:var(--dhad-radius,16px);background:var(--dhad-surface,#fff)}.dhad-field{display:grid;gap:.4rem}.dhad-field input,.dhad-field select{width:100%;padding:.7rem;border:1px solid #cfcfcf;border-radius:10px;font:inherit;background:#fff}.dhad-check{display:flex;gap:.5rem;align-items:center}.dhad-badge{display:inline-flex;width:max-content;padding:.2rem .6rem;border-radius:999px;font-size:.85rem;background:#eee}.dhad-badge-primary{background:color-mix(in srgb,var(--dhad-primary,#2563eb) 15%,#fff);color:var(--dhad-primary,#2563eb)}.dhad-alert{padding:.8rem 1rem;border-radius:10px}.dhad-alert-info{background:#e8f1ff}.dhad-alert-success{background:#e5f7ec;color:#175c31}.dhad-alert-warning{background:#fff4d6;color:#704d00}.dhad-alert-danger{background:#fde8e8;color:#8a1c1c}.dhad-progress{width:100%;height:.7rem}.dhad-spinner{display:inline-block;width:1.2rem;height:1.2rem;border:.18rem solid #ddd;border-top-color:var(--dhad-primary,#2563eb);border-radius:50%;animation:dhad-spin 1s linear infinite}.dhad-skeleton{background:linear-gradient(90deg,#eee,#f7f7f7,#eee);border-radius:8px;animation:dhad-pulse 1.5s infinite}.dhad-image{max-width:100%;height:auto}.dhad-image-rounded{border-radius:var(--dhad-radius,16px)}.dhad-image-circle{aspect-ratio:1;border-radius:50%;object-fit:cover}.dhad-avatar{width:var(--dhad-avatar-size,48px);height:var(--dhad-avatar-size,48px);border-radius:50%;object-fit:cover}.dhad-quote{padding:1rem;border-inline-start:4px solid var(--dhad-primary,#2563eb);background:#f7f7f7}.dhad-table-wrap{overflow:auto}.dhad-table{width:100%;border-collapse:collapse}.dhad-table th,.dhad-table td{padding:.7rem;border-bottom:1px solid #ddd;text-align:start}.dhad-stat{padding:1rem;border:1px solid #ddd;border-radius:var(--dhad-radius,16px);display:grid;gap:.2rem}.dhad-stat span{opacity:.7}.dhad-stat strong{font-size:2rem}.dhad-stat small{opacity:.65}.dhad-hero{padding:6rem 0;background:linear-gradient(135deg,color-mix(in srgb,var(--dhad-primary,#2563eb) 12%,#fff),#fff)}.dhad-hero h1{font-size:clamp(2.5rem,7vw,5rem);line-height:1.05;margin:.5rem 0}.dhad-hero p{max-width:760px;font-size:1.15rem;opacity:.8}.dhad-nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--dhad-surface,#fff) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid #ddd}.dhad-nav-inner{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:1rem}.dhad-nav-links{display:flex;gap:1rem;flex-wrap:wrap}.dhad-dialog{border:0;border-radius:18px;padding:0;max-width:min(92vw,600px)}.dhad-dialog-box{padding:1.5rem}.dhad-tabs{display:flex;gap:.5rem;border-bottom:1px solid #ddd;flex-wrap:wrap}.dhad-tab{padding:.6rem .9rem;text-decoration:none;color:inherit;border-bottom:2px solid transparent}.dhad-tab.active{color:var(--dhad-primary,#2563eb);border-color:currentColor}@keyframes dhad-spin{to{transform:rotate(360deg)}}@keyframes dhad-pulse{50%{opacity:.55}}@media(max-width:760px){.dhad-grid{grid-template-columns:1fr!important}.dhad-nav-links{display:none}.dhad-hero{padding:4rem 0}}:root{--dhad-primary:#176B57}body{margin:0;background:#f6f7f4;color:#17202A;font-family:system-ui;line-height:1.7}.حاوية{width:min(1100px,92%);margin:auto}.شريط{padding:18px 0}.بطل{padding:70px 0;background:linear-gradient(135deg,#e6f5ef,#fff)}.بطل h1{font-size:clamp(2.2rem,6vw,4.5rem);margin:0 0 12px}.شبكة{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:36px 0}.بطاقة{background:#fff;border:1px solid #dde5df;border-radius:18px;padding:22px;box-shadow:0 8px 28px rgba(0,0,0,.06)}.بطاقة strong{display:block;font-size:1.35rem;margin:16px 0;color:#176B57}.زر{border:0;border-radius:12px;padding:11px 16px;background:#176B57;color:#fff;font:inherit;cursor:pointer}.تذييل{padding:30px 0;border-top:1px solid #dde5df;margin-top:20px}@media(max-width:760px){.شبكة{grid-template-columns:1fr}}</style><header class="شريط"><div class="حاوية شريط">متجر ضاد</div></header><section class="بطل"><div class="حاوية بطل"><h1>متجر ضاد</h1><p>منتجات عربية مختارة بجودة عالية.</p></div></section><div class="شبكة حاوية">
