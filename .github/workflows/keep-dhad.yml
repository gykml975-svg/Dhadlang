name: Delete everything except dhad

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete everything except dhad
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name "Dadelange Editor Beta" \
            -exec rm -rf {} +

          find "Dadelange Editor Beta" -mindepth 1 -maxdepth 1 \
            ! -name "dhad" \
            -exec rm -rf {} +

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Keep only dhad folder"
            git push
          fi
